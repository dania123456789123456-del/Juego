<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BREAKOUT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --bg: #04040d;
    --accent1: #f72585;
    --accent2: #7209b7;
    --accent3: #4cc9f0;
    --paddle: #f72585;
    --ball: #4cc9f0;
    --text: #e0e0ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 10% 10%, #f7258522 0%, transparent 50%),
      radial-gradient(ellipse at 90% 90%, #4cc9f022 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, #7209b711 0%, transparent 70%);
    pointer-events: none;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 900;
    letter-spacing: 0.8rem;
    margin-bottom: 1rem;
    background: linear-gradient(90deg, var(--accent1), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px #f7258877);
    animation: flicker 3s ease-in-out infinite;
  }

  @keyframes flicker {
    0%,95%,100% { opacity: 1; }
    96% { opacity: 0.7; }
    97% { opacity: 1; }
    98% { opacity: 0.5; }
  }

  .hud {
    display: flex;
    gap: 2.5rem;
    margin-bottom: 0.8rem;
  }

  .hud-box {
    text-align: center;
  }

  .hud-label {
    color: #ffffff44;
    font-size: 0.45rem;
    letter-spacing: 0.25rem;
    display: block;
    margin-bottom: 0.3rem;
  }

  .hud-value {
    color: var(--text);
    font-size: 1rem;
    font-weight: 700;
    text-shadow: 0 0 12px var(--accent3);
  }

  .lives-display {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 2px;
  }

  .heart {
    color: var(--accent1);
    font-size: 0.9rem;
    filter: drop-shadow(0 0 6px #f72585);
    transition: all 0.3s;
  }

  .heart.lost {
    color: #333;
    filter: none;
  }

  .game-wrapper {
    position: relative;
  }

  canvas {
    display: block;
    border: 1px solid #f7258533;
    box-shadow:
      0 0 40px #f7258522,
      0 0 80px #7209b711,
      0 0 0 1px #4cc9f011;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #04040dee;
    backdrop-filter: blur(6px);
  }

  .overlay h2 {
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: 0.4rem;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, var(--accent1), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .overlay .big-score {
    font-size: 3rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 30px var(--accent3);
    margin: 0.5rem 0;
  }

  .overlay p {
    color: #ffffff55;
    font-size: 0.4rem;
    letter-spacing: 0.2rem;
    margin-bottom: 0.2rem;
  }

  .btn {
    margin-top: 1.5rem;
    background: transparent;
    border: 2px solid var(--accent1);
    color: var(--accent1);
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 0.6rem;
    padding: 0.9rem 2.5rem;
    cursor: pointer;
    letter-spacing: 0.3rem;
    text-shadow: 0 0 10px var(--accent1);
    box-shadow: 0 0 20px #f7258533, inset 0 0 20px #f7258511;
    transition: all 0.2s;
  }

  .btn:hover {
    background: #f7258522;
    box-shadow: 0 0 40px #f7258566, inset 0 0 30px #f7258522;
    transform: scale(1.05);
  }

  .hidden { display: none; }

  .controls {
    margin-top: 0.8rem;
    color: #ffffff22;
    font-size: 0.35rem;
    letter-spacing: 0.15rem;
    text-align: center;
  }

  /* Mobile paddle control */
  .touch-bar {
    display: none;
    margin-top: 1rem;
    width: 400px;
    height: 60px;
    background: #0d0d1a;
    border: 1px solid #f7258533;
    border-radius: 4px;
    align-items: center;
    justify-content: space-between;
    padding: 0 1rem;
    touch-action: none;
    cursor: pointer;
  }

  .touch-hint {
    color: #f7258566;
    font-size: 0.5rem;
    letter-spacing: 0.1rem;
    pointer-events: none;
  }

  @media (max-width: 480px) {
    canvas { width: 340px; height: 500px; }
    .touch-bar { width: 340px; display: flex; }
    .controls { display: none; }
    h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<h1>BREAKOUT</h1>

<div class="hud">
  <div class="hud-box">
    <span class="hud-label">SCORE</span>
    <span class="hud-value" id="score">0</span>
  </div>
  <div class="hud-box">
    <span class="hud-label">BEST</span>
    <span class="hud-value" id="best">0</span>
  </div>
  <div class="hud-box">
    <span class="hud-label">LEVEL</span>
    <span class="hud-value" id="level">1</span>
  </div>
  <div class="hud-box">
    <span class="hud-label">VIDAS</span>
    <div class="lives-display" id="lives">
      <span class="heart">♥</span>
      <span class="heart">♥</span>
      <span class="heart">♥</span>
    </div>
  </div>
</div>

<div class="game-wrapper">
  <canvas id="canvas" width="400" height="500"></canvas>

  <div class="overlay" id="startScreen">
    <h2>BREAKOUT</h2>
    <p style="margin-top:0.5rem">DESTRUYE TODOS LOS BLOQUES</p>
    <p>NO DEJES CAER LA PELOTA</p>
    <p>CADA NIVEL ES MÁS RÁPIDO</p>
    <button class="btn" id="startBtn">JUGAR</button>
  </div>

  <div class="overlay hidden" id="winScreen">
    <h2>¡NIVEL SUPERADO!</h2>
    <div class="big-score" id="winScore">0</div>
    <p>PUNTUACIÓN</p>
    <button class="btn" id="nextBtn">SIGUIENTE NIVEL</button>
  </div>

  <div class="overlay hidden" id="gameOverScreen">
    <h2>GAME OVER</h2>
    <div class="big-score" id="finalScore">0</div>
    <p>PUNTUACIÓN FINAL</p>
    <button class="btn" id="restartBtn">REINICIAR</button>
  </div>
</div>

<div class="touch-bar" id="touchBar">
  <span class="touch-hint">◄ DESLIZA PARA MOVER ►</span>
</div>

<p class="controls">MOUSE / FLECHAS PARA MOVER &nbsp;|&nbsp; ESPACIO PARA LANZAR</p>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

let score, best, level, lives, ballLaunched;
let paddle, ball, blocks, particles;
let animId, running;

best = parseInt(localStorage.getItem('breakoutBest') || '0');
document.getElementById('best').textContent = best;

const COLORS = [
  ['#f72585','#f7258588'],
  ['#b5179e','#b5179e88'],
  ['#7209b7','#7209b788'],
  ['#560bad','#560bad88'],
  ['#480ca8','#480ca888'],
  ['#3a0ca3','#3a0ca388'],
  ['#3f37c9','#3f37c988'],
  ['#4361ee','#4361ee88'],
  ['#4895ef','#4895ef88'],
  ['#4cc9f0','#4cc9f088'],
];

function makeBlocks(lvl) {
  const rows = Math.min(4 + lvl, 8);
  const cols = 8;
  const bw = (W - 60) / cols;
  const bh = 22;
  const blocks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ci = Math.floor(r * COLORS.length / rows);
      blocks.push({
        x: 30 + c * bw,
        y: 50 + r * (bh + 5),
        w: bw - 4,
        h: bh,
        color: COLORS[ci][0],
        glow: COLORS[ci][1],
        alive: true,
        hp: lvl > 3 && r < 2 ? 2 : 1
      });
    }
  }
  return blocks;
}

function init(lvl) {
  level = lvl || 1;
  lives = lives !== undefined && lvl > 1 ? lives : 3;
  score = score !== undefined && lvl > 1 ? score : 0;
  ballLaunched = false;
  running = true;

  paddle = { x: W/2 - 45, y: H - 30, w: 90, h: 12, speed: 7 };
  ball = {
    x: W/2, y: H - 50,
    vx: 3 + (level-1)*0.4,
    vy: -(3.5 + (level-1)*0.4),
    r: 7
  };
  blocks = makeBlocks(level);
  particles = [];

  updateHUD();
}

function updateHUD() {
  document.getElementById('score').textContent = score;
  document.getElementById('best').textContent = best;
  document.getElementById('level').textContent = level;
  const hearts = document.querySelectorAll('.heart');
  hearts.forEach((h, i) => h.classList.toggle('lost', i >= lives));
}

// Particles
function spawnParticles(x, y, color) {
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const spd = 1.5 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      color,
      r: 2 + Math.random() * 3
    });
  }
}

// Input
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (e.key === ' ' && !ballLaunched && running) ballLaunched = true;
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (W / rect.width);
  paddle.x = mx - paddle.w / 2;
  paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
});

canvas.addEventListener('click', () => { if (!ballLaunched && running) ballLaunched = true; });

// Touch
const touchBar = document.getElementById('touchBar');
let lastTouchX = null;
touchBar.addEventListener('touchstart', e => { lastTouchX = e.touches[0].clientX; });
touchBar.addEventListener('touchmove', e => {
  if (lastTouchX !== null) {
    const dx = e.touches[0].clientX - lastTouchX;
    paddle.x += dx * 1.5;
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
    lastTouchX = e.touches[0].clientX;
  }
  e.preventDefault();
}, { passive: false });
touchBar.addEventListener('touchend', () => {
  lastTouchX = null;
  if (!ballLaunched && running) ballLaunched = true;
});

function update() {
  // Paddle keyboard
  if (keys['ArrowLeft'])  { paddle.x -= paddle.speed; paddle.x = Math.max(0, paddle.x); }
  if (keys['ArrowRight']) { paddle.x += paddle.speed; paddle.x = Math.min(W - paddle.w, paddle.x); }

  if (!ballLaunched) {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    return;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  // Wall bounce
  if (ball.x - ball.r < 0)  { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r > W)  { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r < 0)  { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  // Ball lost
  if (ball.y - ball.r > H) {
    lives--;
    updateHUD();
    if (lives <= 0) {
      running = false;
      document.getElementById('finalScore').textContent = score;
      document.getElementById('gameOverScreen').classList.remove('hidden');
      return;
    }
    ballLaunched = false;
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - ball.r - 2;
    ball.vx = 3 + (level-1)*0.4;
    ball.vy = -(3.5 + (level-1)*0.4);
    return;
  }

  // Paddle collision
  if (ball.y + ball.r >= paddle.y &&
      ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.w &&
      ball.vy > 0) {
    const hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
    ball.vx = hit * 5;
    ball.vy = -Math.abs(ball.vy);
    // speed cap
    const spd = Math.sqrt(ball.vx**2 + ball.vy**2);
    const maxSpd = 8 + level;
    if (spd > maxSpd) { ball.vx = ball.vx/spd*maxSpd; ball.vy = ball.vy/spd*maxSpd; }
  }

  // Block collision
  let allDead = true;
  for (const b of blocks) {
    if (!b.alive) continue;
    allDead = false;
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
        ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      b.hp--;
      if (b.hp <= 0) {
        b.alive = false;
        score += 10 * level;
        if (score > best) { best = score; localStorage.setItem('breakoutBest', best); }
        spawnParticles(b.x + b.w/2, b.y + b.h/2, b.color);
        updateHUD();
      }
      // Which side
      const fromLeft   = Math.abs(ball.x + ball.r - b.x);
      const fromRight  = Math.abs(ball.x - ball.r - (b.x + b.w));
      const fromTop    = Math.abs(ball.y + ball.r - b.y);
      const fromBottom = Math.abs(ball.y - ball.r - (b.y + b.h));
      const min = Math.min(fromLeft, fromRight, fromTop, fromBottom);
      if (min === fromLeft || min === fromRight) ball.vx *= -1;
      else ball.vy *= -1;
      break;
    }
  }

  if (allDead) {
    running = false;
    document.getElementById('winScore').textContent = score;
    document.getElementById('winScreen').classList.remove('hidden');
  }

  // Particles
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.1;
    p.life -= 0.035;
  });
  particles = particles.filter(p => p.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // BG scanlines
  ctx.fillStyle = '#04040d';
  ctx.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 4) {
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.fillRect(0, y, W, 2);
  }

  // Blocks
  blocks.forEach(b => {
    if (!b.alive) return;
    ctx.save();
    ctx.shadowColor = b.color;
    ctx.shadowBlur = b.hp > 1 ? 18 : 10;
    ctx.fillStyle = b.hp > 1 ? b.color : b.color + 'cc';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Shine
    const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    g.addColorStop(0, 'rgba(255,255,255,0.25)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(b.x, b.y, b.w, b.h/2);
    // Crack on hp2
    if (b.hp > 1) {
      ctx.strokeStyle = '#ffffff44';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(b.x + b.w*0.3, b.y + 4);
      ctx.lineTo(b.x + b.w*0.5, b.y + b.h - 4);
      ctx.stroke();
    }
    ctx.restore();
  });

  // Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  });

  // Paddle
  ctx.save();
  ctx.shadowColor = '#f72585';
  ctx.shadowBlur = 20;
  const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x + paddle.w, paddle.y);
  pg.addColorStop(0, '#f72585');
  pg.addColorStop(0.5, '#ff6eb4');
  pg.addColorStop(1, '#f72585');
  ctx.fillStyle = pg;
  ctx.beginPath();
  ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
  ctx.fill();
  ctx.restore();

  // Ball
  ctx.save();
  ctx.shadowColor = '#4cc9f0';
  ctx.shadowBlur = 25;
  const bg = ctx.createRadialGradient(ball.x - 2, ball.y - 2, 1, ball.x, ball.y, ball.r);
  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(0.4, '#4cc9f0');
  bg.addColorStop(1, '#0077b6');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Launch hint
  if (!ballLaunched && running) {
    ctx.fillStyle = '#ffffff22';
    ctx.font = '500 0.5rem Orbitron';
    ctx.textAlign = 'center';
    ctx.fillText('CLICK O ESPACIO PARA LANZAR', W/2, H - 10);
  }
}

function loop() {
  if (!running) return;
  update();
  draw();
  animId = requestAnimationFrame(loop);
}

function startGame(lvl) {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('winScreen').classList.add('hidden');
  if (lvl === 1) { score = 0; lives = 3; }
  init(lvl);
  cancelAnimationFrame(animId);
  loop();
}

document.getElementById('startBtn').addEventListener('click', () => startGame(1));
document.getElementById('restartBtn').addEventListener('click', () => startGame(1));
document.getElementById('nextBtn').addEventListener('click', () => startGame(level + 1));
</script>
</body>
</html>
